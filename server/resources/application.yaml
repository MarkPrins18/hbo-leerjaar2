ktor:
  deployment:
    port: 8080
  application:
    modules:
      - SerializationKt.configureSerialization
      - ExposedKt.configureExposed
      - StatusPagesKt.configureStatusPages
      - RoutingKt.configureRouting
database:
  url: "$DB_URL:jdbc:h2:file:./server/resources/data/database/carshare;MODE=MySQL;DATABASE_TO_LOWER=TRUE;TRACE_LEVEL_FILE=0"
  user: "$DB_USER:sa"
  password: "$DB_PASSWORD:"
  reset-schema: true
  seed-data: true

rdw:
  appToken: "$RDW_APP_TOKEN:"