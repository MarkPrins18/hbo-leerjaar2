ktor:
  deployment:
    port: 8080
  application:
    modules:
      - SerializationKt.configureSerialization
      - ExposedKt.configureExposed
      - StatusPagesKt.configureStatusPages
      - RoutingKt.configureRouting
database:
  url: "jdbc:h2:file:./server/resources/data/database/carshare;MODE=MySQL;DATABASE_TO_LOWER=TRUE;TRACE_LEVEL_FILE=0"
  user: "$DB_USER:sa"
  password: "$DB_PASSWORD:"
  reset-schema: true
  seed-data: true

photos:
  directory: "./server/resources/data/database/photos"

rdw:
  appToken: "$RDW_APP_TOKEN:"

gemini:
  apiKey: "$GEMINI_API_KEY:"
  model: "$GEMINI_MODEL:gemini-flash-lite-latest"

jwt:
  secret: "$JWT_SECRET:dev-secret-change-me"
  issuer: "carshare"
  audience: "carshare-users"
  realm: "carshare"
  expiration-minutes: 60
