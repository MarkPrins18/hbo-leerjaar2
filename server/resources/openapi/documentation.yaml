openapi: 3.0.3
info:
  title: Car Sharing API
  version: "1.0.0"

paths:
  /cars:
    get:
      summary: Haal alle auto's op
      operationId: getAllCars
      tags:
        - Cars
      description: |
        Geeft alle auto's terug. Filters zijn optioneel en kunnen gecombineerd
        worden, bijvoorbeeld:
        `/cars?maxPrice=50&maxDistanceKm=10&latitude=51.5853&longitude=4.7946`

        Met `startTime` en `endTime` komen alleen auto's terug die in dat tijdvak
        vrij zijn, bijvoorbeeld:
        `/cars?startTime=2027-01-15T10:00:00Z&endTime=2027-01-15T17:00:00Z`
      parameters:
        - $ref: "#/components/parameters/MaxPrice"
        - $ref: "#/components/parameters/MaxDistanceKm"
        - $ref: "#/components/parameters/Latitude"
        - $ref: "#/components/parameters/Longitude"
        - $ref: "#/components/parameters/AvailableFrom"
        - $ref: "#/components/parameters/AvailableUntil"
      responses:
        "200":
          description: Lijst van alle auto's
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Car"
        "400":
          description: Ongeldige filterwaarde (geen getal, geen ISO-8601-tijdstip of buiten bereik), maxDistanceKm, latitude en longitude niet alle drie opgegeven, alleen startTime of endTime opgegeven, of endTime niet na startTime
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /cars/license-plate/{licensePlate}:
    get:
      summary: Haal een auto op via het kenteken
      operationId: getCarByLicensePlate
      tags:
        - Cars
      parameters:
        - name: licensePlate
          in: path
          required: true
          description: Het kenteken van de auto
          schema:
            type: string
          example: KS711F
      responses:
        "200":
          description: Auto gevonden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Car"
        "404":
          description: Auto niet gevonden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cars/mine:
    get:
      summary: Haal de auto's van de ingelogde gebruiker op
      operationId: getMyCars
      tags:
        - Cars
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Auto's waarvan de ingelogde gebruiker eigenaar is
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Car"
        "401":
          description: Niet ingelogd
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cars/map:
    get:
      summary: Haal de auto's op voor de kaart
      description: |
        Geeft per auto de laatste bekende positie en de prijs per dag terug.
        Ondersteunt dezelfde filters als `GET /cars`. Een auto zonder locatie of
        huurvoorwaarden komt mee met `null` als positie of prijs, tenzij een
        afstands- of prijsfilter hem uitsluit.
      operationId: getCarMap
      tags:
        - Cars
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MaxPrice"
        - $ref: "#/components/parameters/MaxDistanceKm"
        - $ref: "#/components/parameters/Latitude"
        - $ref: "#/components/parameters/Longitude"
        - $ref: "#/components/parameters/AvailableFrom"
        - $ref: "#/components/parameters/AvailableUntil"
      responses:
        "200":
          description: Auto's met positie en prijs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CarMapResponse"
        "400":
          description: Ongeldige filterwaarde, zie GET /cars
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Niet ingelogd
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cars/{id}:
    get:
      summary: Haal een auto op via het id
      operationId: getCarById
      tags:
        - Cars
      parameters:
        - name: id
          in: path
          required: true
          description: Het id van de auto
          schema:
            type: integer
            format: int32
          example: 1
      responses:
        "200":
          description: Auto gevonden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Car"
        "400":
          description: Ongeldig auto-id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Auto niet gevonden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      summary: Werk een auto bij via het id
      operationId: updateCar
      tags:
        - Cars
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Het id van de auto
          schema:
            type: integer
            format: int32
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CarChangeRequest"
      responses:
        "200":
          description: Auto succesvol bijgewerkt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Car"
        "400":
          description: Ongeldige waarde of veld hoort niet bij het type auto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Niet ingelogd
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Ingelogde gebruiker is niet de eigenaar van de auto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Auto niet gevonden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Kenteken bestaat al
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      summary: Verwijder een auto via het id
      operationId: deleteCar
      tags:
        - Cars
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Het id van de auto
          schema:
            type: integer
            format: int32
          example: 1
      responses:
        "204":
          description: Auto succesvol verwijderd
        "401":
          description: Niet ingelogd
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Ingelogde gebruiker is niet de eigenaar van de auto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Auto niet gevonden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /cars/{id}/cost-data:
    post:
      summary: "Testroute: vul ontbrekende MRB en verbruik aan via Gemini"
      description: >
        Vraagt Gemini alleen om de waardes die nog leeg zijn (roadTaxPerQuarter, consumptionCombined)
        en slaat ze op bij de auto. Zijn beide al ingevuld, dan wordt Gemini niet aangeroepen.
        Alleen de ingelogde eigenaar van de auto mag dit doen.
        Seedauto 2 (BEV, eigenaar 2) heeft geen verbruik en is daarom handig om mee te testen.
      operationId: fillMissingCostData
      tags:
        - Cars
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Het id van de auto
          schema:
            type: integer
            format: int32
          example: 2
      responses:
        "200":
          description: Auto met de aangevulde waardes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Car"
        "401":
          description: Niet ingelogd
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Ingelogde gebruiker is niet de eigenaar van de auto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Auto niet gevonden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: De Gemini API is niet bereikbaar of gaf een ongeldig antwoord
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /cars/{id}/fuel-cost:
    get:
      summary: Bereken de geschatte verbruikskosten voor een afstand
      description: >
        Alleen de ingelogde eigenaar van de auto mag de kosten opvragen. De berekening hangt af van de categorie:
        ICE (liter brandstof), BEV (kWh stroom) of FCEV (kg waterstof), met vaste prijzen per eenheid.
        Is het verbruik van de auto onbekend, dan wordt het eerst via Gemini aangevuld.
      operationId: getFuelCost
      tags:
        - Cars
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Het id van de auto
          schema:
            type: integer
            format: int32
          example: 1
        - name: distanceKm
          in: query
          required: true
          description: De afstand in km (0 tot en met 1.000.000)
          schema:
            type: number
            format: double
          example: 100
      responses:
        "200":
          description: Geschatte verbruikskosten
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FuelCost"
        "400":
          description: distanceKm ontbreekt, is geen getal of is negatief
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Niet ingelogd
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: De ingelogde gebruiker is geen eigenaar van deze auto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Auto niet gevonden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Het verbruik van de auto is onbekend, ook na aanvullen via Gemini
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: De Gemini API is niet bereikbaar of gaf een ongeldig antwoord
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /cars/{id}/tco:
    get:
      summary: Bereken de Total Cost of Ownership per jaar en per maand
      description: >
        Alleen de ingelogde eigenaar van de auto mag de TCO opvragen. De TCO bestaat uit de verbruikskosten
        voor annualKm (dezelfde berekening als fuel-cost) plus de wegenbelasting (roadTaxPerQuarter x 4).
        Zijn het verbruik of de wegenbelasting onbekend, dan worden ze eerst via Gemini aangevuld.
      operationId: getTco
      tags:
        - Cars
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Het id van de auto
          schema:
            type: integer
            format: int32
          example: 1
        - name: annualKm
          in: query
          required: false
          description: Aantal km per jaar (0 tot en met 1.000.000), standaard 15.000
          schema:
            type: number
            format: double
            default: 15000
          example: 15000
      responses:
        "200":
          description: De jaarlijkse en maandelijkse TCO
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tco"
        "400":
          description: annualKm is geen getal, is negatief of is te groot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Niet ingelogd
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: De ingelogde gebruiker is geen eigenaar van deze auto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Auto niet gevonden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Het verbruik of de wegenbelasting van de auto is onbekend, ook na aanvullen via Gemini
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: De Gemini API is niet bereikbaar of gaf een ongeldig antwoord
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /cars/import:
    post:
      summary: Importeer een auto via het kenteken
      description: De ingelogde gebruiker wordt de eigenaar van de auto.
      operationId: importCar
      tags:
        - Cars
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CarRequest"
      responses:
        "201":
          description: Auto succesvol geïmporteerd
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Car"
        "400":
          description: Ongeldige waarde in de request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Niet ingelogd
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Kenteken bestaat al
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Kenteken onbekend bij de RDW, of RDW-gegevens niet te verwerken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: De RDW API is niet bereikbaar of gaf een ongeldig antwoord
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /cars/{id}/photos:
    post:
      summary: Upload een foto van een auto
      description: Alleen de ingelogde eigenaar van de auto mag een foto uploaden. Alleen JPEG, maximaal 5 MB.
      operationId: uploadCarPhoto
      tags:
        - Photos
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Het id van de auto
          schema:
            type: integer
            format: int32
          example: 1
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - photo
              properties:
                photo:
                  type: string
                  format: binary
      responses:
        "201":
          description: Foto succesvol opgeslagen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Photo"
        "400":
          description: Geen foto meegestuurd of het bestand is leeg
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Niet ingelogd
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: De ingelogde gebruiker is geen eigenaar van deze auto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Auto niet gevonden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Foto is groter dan 5 MB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: Foto is geen JPEG
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      summary: Haal de foto's van een auto op
      operationId: getCarPhotos
      tags:
        - Photos
      parameters:
        - name: id
          in: path
          required: true
          description: Het id van de auto
          schema:
            type: integer
            format: int32
          example: 1
      responses:
        "200":
          description: Lijst met foto's van de auto
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Photo"
        "404":
          description: Auto niet gevonden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /photos/{id}:
    get:
      summary: Haal een foto op
      operationId: getPhoto
      tags:
        - Photos
      parameters:
        - name: id
          in: path
          required: true
          description: Het id van de foto
          schema:
            type: integer
            format: int32
          example: 1
      responses:
        "200":
          description: De foto
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "404":
          description: Foto niet gevonden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /cars/{carId}/maps:
    get:
      summary: Open de locatie van een auto in Google Maps
      description: Geeft een Google Maps-URL met de laatst bekende locatie van de auto. Alleen voor de eigenaar of een huurder met een bevestigde reservering die nu loopt.
      operationId: getCarLocationInMaps
      tags:
        - Maps
      security:
        - bearerAuth: []
      parameters:
        - name: carId
          in: path
          required: true
          description: Het id van de auto
          schema:
            type: integer
            format: int32
          example: 1
      responses:
        "200":
          description: URL van de laatst bekende locatie in Google Maps
          content:
            text/plain:
              schema:
                type: string
                format: uri
              example: https://www.google.com/maps/dir/?api=1&destination=51.6436,4.86044
        "400":
          description: Ongeldig auto-id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Niet ingelogd
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: De ingelogde gebruiker is geen eigenaar en heeft geen actieve reservering voor deze auto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Auto niet gevonden of geen locatie bekend voor deze auto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /cars/{id}/location:
    put:
      summary: Stel de huidige locatie van een auto in
      description: |
        Alleen de ingelogde eigenaar van de auto mag dit. Voegt een nieuwe locatierij toe
        met de huidige tijd; de nieuwste rij geldt als huidige locatie van de auto.
      operationId: setCarLocation
      tags:
        - Maps
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Het id van de auto
          schema:
            type: integer
            format: int32
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationRequest"
      responses:
        "200":
          description: Locatie succesvol ingesteld
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "400":
          description: Ongeldig auto-id, ongeldige request body of latitude/longitude buiten het bereik
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Niet ingelogd
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Ingelogde gebruiker is niet de eigenaar van de auto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Auto niet gevonden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /cars/{id}/rental-terms:
    get:
      summary: Haal de verhuurvoorwaarden van een auto op
      operationId: getRentalTerms
      tags:
        - RentalTerms
      parameters:
        - name: id
          in: path
          required: true
          description: Het id van de auto
          schema:
            type: integer
            format: int32
          example: 1
      responses:
        "200":
          description: De verhuurvoorwaarden van de auto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RentalTerms"
        "400":
          description: Ongeldig auto-id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Auto niet gevonden of geen verhuurvoorwaarden bekend
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      summary: Stel de verhuurvoorwaarden van een auto in
      description: Alleen de ingelogde eigenaar van de auto mag dit. Maakt de verhuurvoorwaarden aan, of overschrijft ze als ze al bestaan.
      operationId: setRentalTerms
      tags:
        - RentalTerms
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Het id van de auto
          schema:
            type: integer
            format: int32
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RentalTermsRequest"
      responses:
        "200":
          description: Verhuurvoorwaarden succesvol ingesteld
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RentalTerms"
        "400":
          description: Ongeldige waarde, bijvoorbeeld een prijs van 0 of lager
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Niet ingelogd
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Ingelogde gebruiker is niet de eigenaar van de auto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Auto niet gevonden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /reservations:
    get:
      summary: Haal de reserveringen van de ingelogde gebruiker op
      description: Gesorteerd op starttijd, de vroegste eerst.
      operationId: getMyReservations
      tags:
        - Reservations
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Reserveringen van de ingelogde gebruiker
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reservation"
        "401":
          description: Niet ingelogd
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: Maak een reservering aan
      description: |
        De reservering komt op naam van de ingelogde gebruiker.
        De totaalprijs is de prijs per dag uit de huurvoorwaarden maal het aantal
        begonnen dagen (elke begonnen 24 uur telt als een dag, minimaal 1).
      operationId: createReservation
      tags:
        - Reservations
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReservationRequest"
      responses:
        "201":
          description: Reservering succesvol aangemaakt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "400":
          description: Ongeldige request, starttijd ligt in het verleden of eindtijd ligt niet na de starttijd
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Niet ingelogd
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Je kunt je eigen auto niet reserveren
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Auto of gebruiker niet gevonden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Auto is in dit tijdsblok al gereserveerd
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Auto heeft nog geen huurvoorwaarden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /reservations/{id}/cancel:
    patch:
      summary: Annuleer een reservering via het id
      description: Alleen de huurder van de reservering mag annuleren.
      operationId: cancelReservation
      tags:
        - Reservations
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Het id van de reservering
          schema:
            type: integer
            format: int32
          example: 1
      responses:
        "200":
          description: Reservering succesvol geannuleerd
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "400":
          description: Ongeldig reservering-id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Niet ingelogd
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: De reservering is van een andere gebruiker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Reservering niet gevonden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Reservering is al geannuleerd of de starttijd is al verstreken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /reservations/{id}/rides:
    post:
      summary: Start een rit voor een reservering
      description: Alleen de huurder van de reservering mag een rit starten.
      operationId: startRide
      tags:
        - Rides
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Het id van de reservering
          schema:
            type: integer
            format: int32
          example: 1
      responses:
        "201":
          description: Rit succesvol gestart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ride"
        "400":
          description: Ongeldig reservering-id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Niet ingelogd
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: De reservering is van een andere gebruiker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Reservering niet gevonden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Reservering is niet bevestigd, is nu niet actief, of er loopt al een rit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /rides/{id}/finish:
    patch:
      summary: Rond een rit af met de gegevens van het telematica-kastje
      description: |
        Slaat de ritgegevens op, zet de status op COMPLETED en kent bonuspunten
        toe voor rustig rijgedrag (zie het veld bonusPoints in het schema Ride).
        De meegestuurde latitude en longitude worden in dezelfde transactie opgeslagen
        als nieuwe, huidige locatie van de auto, en de bijbehorende reservering krijgt
        de status COMPLETED. Daarna kan op die reservering geen nieuwe rit meer starten.
        Alleen de huurder van de bijbehorende reservering mag de rit afronden.
      operationId: finishRide
      tags:
        - Rides
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Het id van de rit
          schema:
            type: integer
            format: int32
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RideFinishRequest"
      responses:
        "200":
          description: Rit succesvol afgerond
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ride"
        "400":
          description: Ongeldig rit-id, ongeldige request body, negatieve waarde, afstand groter dan 6000 km of ongeldige latitude/longitude
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Niet ingelogd
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: De rit hoort bij een reservering van een andere gebruiker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Rit niet gevonden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Rit is al afgerond
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /rides/active:
    get:
      summary: Haal de lopende rit van de ingelogde gebruiker op
      operationId: getActiveRide
      tags:
        - Rides
      security:
        - bearerAuth: []
      responses:
        "200":
          description: De rit met status IN_PROGRESS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ride"
        "204":
          description: De ingelogde gebruiker heeft geen lopende rit (geen body)
        "401":
          description: Niet ingelogd
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /rides:
    get:
      summary: Haal alle ritten van de ingelogde gebruiker op
      description: Alle ritten op reserveringen van de ingelogde gebruiker, lopend en afgerond, de nieuwste eerst.
      operationId: getRides
      tags:
        - Rides
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lijst van ritten, gesorteerd op starttijd aflopend (leeg = [])
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ride"
        "401":
          description: Niet ingelogd
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


  /users:
    get:
      summary: Haal alle gebruikers op (tijdelijk, voor testen)
      operationId: getAllUsers
      tags:
        - Users
      responses:
        "200":
          description: Lijst van alle gebruikers, zonder wachtwoord
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
  /users/register:
    post:
      summary: Maak een nieuw account aan
      description: |
        Het wachtwoord moet minimaal 8 tekens lang zijn en een hoofdletter,
        een kleine letter, een cijfer en een speciaal teken bevatten.
      operationId: register
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account succesvol aangemaakt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Ongeldig e-mailadres of te zwak wachtwoord, de foutmelding noemt het veld
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Er bestaat al een account met dit e-mailadres
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /users/login:
    post:
      summary: Log in met e-mail en wachtwoord
      description: |
        Geeft een JWT-token terug. Gebruik deze token via de knop "Authorize"
        om beveiligde endpoints aan te roepen.
      operationId: login
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Succesvol ingelogd
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Ongeldige request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Onjuist e-mailadres of wachtwoord
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /users/me:
    get:
      summary: Haal de ingelogde gebruiker op
      operationId: getMe
      tags:
        - Users
      security:
        - bearerAuth: []
      responses:
        "200":
          description: De ingelogde gebruiker, zonder wachtwoord
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Niet ingelogd
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Gebruiker bestaat niet meer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    MaxPrice:
      name: maxPrice
      in: query
      required: false
      description: Maximale prijs per dag. Auto's zonder verhuurvoorwaarden vallen dan af.
      schema:
        type: number
        format: double
        minimum: 0
      example: 50.0
    MaxDistanceKm:
      name: maxDistanceKm
      in: query
      required: false
      description: Maximale afstand vanaf de opgegeven coördinaten in kilometer. Alleen samen met latitude en longitude.
      schema:
        type: number
        format: double
        minimum: 0
      example: 10.0
    Latitude:
      name: latitude
      in: query
      required: false
      description: Breedtegraad van het vertrekpunt. Alleen samen met maxDistanceKm en longitude.
      schema:
        type: number
        format: double
        minimum: -90
        maximum: 90
      example: 51.5853
    Longitude:
      name: longitude
      in: query
      required: false
      description: Lengtegraad van het vertrekpunt. Alleen samen met maxDistanceKm en latitude.
      schema:
        type: number
        format: double
        minimum: -180
        maximum: 180
      example: 4.7946
    AvailableFrom:
      name: startTime
      in: query
      required: false
      description: Begin van het tijdvak (ISO-8601). Alleen samen met endTime. Auto's met een actieve reservering (PENDING of CONFIRMED) die het tijdvak overlapt, vallen af.
      schema:
        type: string
        format: date-time
      example: "2027-01-15T10:00:00Z"
    AvailableUntil:
      name: endTime
      in: query
      required: false
      description: Eind van het tijdvak (ISO-8601), na startTime. Alleen samen met startTime.
      schema:
        type: string
        format: date-time
      example: "2027-01-15T17:00:00Z"
  schemas:
    ErrorResponse:
      type: object
      description: |
        Foutresponse van de API, met de HTTP-statuscode en een Nederlandse melding.
        Elke fout heeft deze body, ook een onbekende route (404) en een niet-toegestane
        methode op een bestaande route (405).
      required:
        - status
        - message
      properties:
        status:
          type: integer
          format: int32
          example: 404
        message:
          type: string
          example: Auto 1 niet gevonden
    Car:
      oneOf:
        - $ref: "#/components/schemas/ICECar"
        - $ref: "#/components/schemas/BEVCar"
        - $ref: "#/components/schemas/FCEVCar"
      discriminator:
        propertyName: type
        mapping:
          ICECar: "#/components/schemas/ICECar"
          BEVCar: "#/components/schemas/BEVCar"
          FCEVCar: "#/components/schemas/FCEVCar"

    CarBase:
      type: object
      required:
        - id
        - userId
        - licensePlate
        - brand
        - model
        - productionYear
        - color
        - vehicleType
        - readyToDriveWeightKg
      properties:
        id:
          type: integer
        userId:
          type: integer
        licensePlate:
          type: string
        brand:
          type: string
        model:
          type: string
        productionYear:
          type: integer
        trim:
          type: string
          nullable: true
        color:
          type: string
        seats:
          type: integer
          nullable: true
        doors:
          type: integer
          nullable: true
        vehicleType:
          type: string
          enum:
            - PASSENGER_CAR
            - LIGHT_COMMERCIAL_VEHICLE
        readyToDriveWeightKg:
          type: integer
        consumptionCombined:
          type: number
          format: double
          nullable: true
        co2EmissionCombined:
          type: number
          format: double
          nullable: true
        roadTaxPerQuarter:
          type: number
          format: double
          nullable: true
          description: "MRB per kwartaal in euro (provincie Noord-Brabant)"

    ICECar:
      allOf:
        - $ref: "#/components/schemas/CarBase"
        - type: object
          required:
            - type
            - fuelType
            - tankCapacityL
            - automaticTransmission
          properties:
            type:
              type: string
              enum: [ICECar]
            fuelType:
              type: string
              enum: [PETROL, DIESEL, LPG]
            tankCapacityL:
              type: number
              format: double
            automaticTransmission:
              type: boolean

    BEVCar:
      allOf:
        - $ref: "#/components/schemas/CarBase"
        - type: object
          required:
            - type
            - batteryCapacityKWh
          properties:
            type:
              type: string
              enum: [BEVCar]
            batteryCapacityKWh:
              type: number
              format: double

    FCEVCar:
      allOf:
        - $ref: "#/components/schemas/CarBase"
        - type: object
          required:
            - type
            - tankCapacityKgH2
          properties:
            type:
              type: string
              enum: [FCEVCar]
            tankCapacityKgH2:
              type: number
              format: double
    CarRequest:
      type: object
      example:
        licensePlate: "R-816-LF"
        trim: null
        tankCapacityL: null
        automaticTransmission: true
        batteryCapacityKWh: null
        tankCapacityKgH2: null
        consumptionCombined: null
        roadTaxPerQuarter: null
      required:
        - licensePlate
      properties:
        licensePlate:
          type: string
        trim:
          type: string
          nullable: true
        tankCapacityL:
          type: number
          format: double
          nullable: true
        automaticTransmission:
          type: boolean
          nullable: true
          default: true
          description: "Alleen voor ICE-auto's. Niet opgegeven = automaat."
        batteryCapacityKWh:
          type: number
          format: double
          nullable: true
        tankCapacityKgH2:
          type: number
          format: double
          nullable: true
        consumptionCombined:
          type: number
          format: double
          nullable: true
        roadTaxPerQuarter:
          type: number
          format: double
          nullable: true
          description: "MRB per kwartaal in euro (provincie Noord-Brabant)"

    ReservationRequest:
      type: object
      required:
        - carId
        - startTime
        - endTime
      properties:
        carId:
          type: integer
          format: int32
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time

    Reservation:
      type: object
      required:
        - id
        - carId
        - userId
        - startTime
        - endTime
        - status
        - totalPrice
      properties:
        id:
          type: integer
        carId:
          type: integer
        userId:
          type: integer
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        status:
          type: string
          enum: [PENDING, CONFIRMED, CANCELLED, COMPLETED]
          description: COMPLETED zodra een rit op de reservering is afgerond
        totalPrice:
          type: number
          format: double
          description: Prijs per dag maal het aantal begonnen dagen (minimaal 1)
          example: 178.0

    CarChangeRequest:
      type: object
      properties:
        licensePlate:
          type: string
          nullable: true
        brand:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        productionYear:
          type: integer
          format: int32
          nullable: true
        trim:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
        seats:
          type: integer
          format: int32
          nullable: true
        doors:
          type: integer
          format: int32
          nullable: true
        vehicleType:
          type: string
          enum:
            - PASSENGER_CAR
            - LIGHT_COMMERCIAL_VEHICLE
          nullable: true
        readyToDriveWeightKg:
          type: integer
          format: int32
          nullable: true
        consumptionCombined:
          type: number
          format: double
          nullable: true
        co2EmissionCombined:
          type: number
          format: double
          nullable: true
        roadTaxPerQuarter:
          type: number
          format: double
          nullable: true
          description: "MRB per kwartaal in euro (provincie Noord-Brabant)"
        fuelType:
          type: string
          enum: [PETROL, DIESEL, LPG]
          nullable: true
        tankCapacityL:
          type: number
          format: double
          nullable: true
        automaticTransmission:
          type: boolean
          nullable: true
        batteryCapacityKWh:
          type: number
          format: double
          nullable: true
        tankCapacityKgH2:
          type: number
          format: double
          nullable: true
    RideFinishRequest:
      type: object
      required:
        - distanceM
        - avgAcceleration
        - avgDeceleration
        - latitude
        - longitude
      properties:
        distanceM:
          type: number
          format: double
          minimum: 0
          maximum: 6000000
          description: Gereden afstand in meter
          example: 12500.0
        avgAcceleration:
          type: number
          format: double
          minimum: 0
          description: Gemiddelde acceleratie in m/s²
          example: 1.8
        avgDeceleration:
          type: number
          format: double
          minimum: 0
          description: Gemiddelde deceleratie in m/s²
          example: 2.1
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: Breedtegraad waar de auto na de rit geparkeerd staat
          example: 51.5853
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: Lengtegraad waar de auto na de rit geparkeerd staat
          example: 4.7946

    Ride:
      type: object
      required:
        - id
        - reservationId
        - startTime
        - status
      properties:
        id:
          type: integer
        reservationId:
          type: integer
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [ IN_PROGRESS, COMPLETED ]
        distanceM:
          type: number
          format: double
          nullable: true
        avgAcceleration:
          type: number
          format: double
          nullable: true
        avgDeceleration:
          type: number
          format: double
          nullable: true
        bonusPoints:
            type: integer
            format: int32
            nullable: true
            description: |
              Bonuspunten voor rustig rijgedrag, berekend bij het afronden.
              Rustig = avgAcceleration < 2,78 m/s² en avgDeceleration < 3,43 m/s².
              Een rustige rit levert 1 punt per volle kilometer op, anders 0.
              Leeg (null) zolang de rit loopt.
    LocationRequest:
      type: object
      required:
        - latitude
        - longitude
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: 51.5853
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: 4.7946
    Location:
      type: object
      required:
        - carId
        - latitude
        - longitude
        - timestamp
      properties:
        carId:
          type: integer
          format: int32
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        timestamp:
          type: string
          format: date-time
    LoginRequest:

      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: eigenaar1@carshare.nl
        password:
          type: string
          format: password
          example: Welkom123!
    LoginResponse:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: JWT-token, 60 minuten geldig
    RegisterRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: jan@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: Geheim123!
    Photo:
      type: object
      required:
        - id
        - carId
        - url
        - uploadedAt
      properties:
        id:
          type: integer
          format: int32
        carId:
          type: integer
          format: int32
        url:
          type: string
          example: /photos/1
        uploadedAt:
          type: string
          format: date-time
    Tco:
      type: object
      required:
        - carId
        - annualKm
        - annualFuelCost
        - annualRoadTax
        - annualTotal
        - monthlyTotal
      properties:
        carId:
          type: integer
          format: int32
          example: 1
        annualKm:
          type: number
          format: double
          example: 15000
        annualFuelCost:
          type: number
          format: double
          description: Verbruikskosten per jaar in EUR
          example: 2369.25
        annualRoadTax:
          type: number
          format: double
          description: Wegenbelasting per jaar in EUR
          example: 600.0
        annualTotal:
          type: number
          format: double
          description: Totale kosten per jaar in EUR
          example: 2969.25
        monthlyTotal:
          type: number
          format: double
          description: Totale kosten per maand in EUR
          example: 247.44

    FuelCost:
      type: object
      required:
        - carId
        - category
        - distanceKm
        - consumptionPer100Km
        - unit
        - pricePerUnit
        - estimatedCost
      properties:
        carId:
          type: integer
          format: int32
        category:
          type: string
          enum: [ICE, BEV, FCEV]
        distanceKm:
          type: number
          format: double
          example: 100
        consumptionPer100Km:
          type: number
          format: double
          example: 8.1
        unit:
          type: string
          enum: [L, kWh, kg]
        pricePerUnit:
          type: number
          format: double
          description: Prijs in EUR per eenheid
          example: 1.95
        estimatedCost:
          type: number
          format: double
          description: Geschatte kosten in EUR, afgerond op 2 decimalen
          example: 15.8
    User:
      type: object
      required:
        - id
        - email
      properties:
        id:
          type: integer
          format: int32
        email:
          type: string
          format: email
    RentalTermsRequest:
      type: object
      required:
        - pricePerDay
        - pickupLocation
      properties:
        pricePerDay:
          type: number
          format: double
          example: 89.00
        pickupLocation:
          type: string
          maxLength: 255
