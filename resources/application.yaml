ktor:
  deployment:
    port: 8080
  application:
    modules:
      - SerializationKt.configureSerialization
      - ExposedKt.configureExposed
      - StatusPagesKt.configureStatusPages
      - AuthenticationKt.configureAuthentication
      - RoutingKt.configureRouting
database:
  url: "$DB_URL?:jdbc:mysql://localhost:3306/carshare"
  user: "$DB_USER?:carshare_app"
  password: "$DB_PASSWORD:"
  reset-schema: true
  seed-data: true

rdw:
  appToken: "$RDW_APP_TOKEN:"

jwt:
  secret: "$JWT_SECRET:dev-secret-change-me"
  issuer: "carshare"
  audience: "carshare-users"
  realm: "carshare"
  expiration-minutes: 60
