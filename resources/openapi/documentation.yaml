openapi: 3.0.3
info:
  title: Car Sharing API
  version: "1.0.0"

paths:
  /cars:
    get:
      summary: Haal alle auto's op
      operationId: getAllCars
      tags:
        - Cars
      description: |
        Geeft alle auto's terug. Filters zijn optioneel en kunnen gecombineerd
        worden, bijvoorbeeld:
        `/cars?maxPrice=50&maxDistanceKm=10&latitude=51.5853&longitude=4.7946`
      parameters:
        - name: maxPrice
          in: query
          required: false
          description: Maximale prijs (wordt nog niet toegepast, wacht op RentalOffer)
          schema:
            type: number
            format: double
            minimum: 0
          example: 50.0
        - name: maxDistanceKm
          in: query
          required: false
          description: Maximale afstand vanaf de opgegeven coördinaten in kilometer. Alleen samen met latitude en longitude.
          schema:
            type: number
            format: double
            minimum: 0
          example: 10.0
        - name: latitude
          in: query
          required: false
          description: Breedtegraad van het vertrekpunt. Alleen samen met maxDistanceKm en longitude.
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
          example: 51.5853
        - name: longitude
          in: query
          required: false
          description: Lengtegraad van het vertrekpunt. Alleen samen met maxDistanceKm en latitude.
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
          example: 4.7946
      responses:
        "200":
          description: Lijst van alle auto's
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Car"
        "400":
          description: Ongeldige filterwaarde (geen getal of buiten bereik), of maxDistanceKm, latitude en longitude niet alle drie opgegeven
  /cars/{licensePlate}:
    get:
      summary: Haal een auto op via het kenteken
      operationId: getCarByLicensePlate
      tags:
        - Cars
      parameters:
        - name: licensePlate
          in: path
          required: true
          description: Het kenteken van de auto
          schema:
            type: string
          example: KS711F
      responses:
        "200":
          description: Auto gevonden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Car"
        "404":
          description: Auto niet gevonden

  /cars/{id}:
    patch:
      summary: Werk een auto bij via het id
      operationId: updateCar
      tags:
        - Cars
      parameters:
        - name: id
          in: path
          required: true
          description: Het id van de auto
          schema:
            type: integer
            format: int32
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CarChangeRequest"
      responses:
        "200":
          description: Auto succesvol bijgewerkt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Car"
        "400":
          description: Ongeldige waarde of veld hoort niet bij het type auto
        "404":
          description: Auto niet gevonden
        "409":
          description: Kenteken bestaat al of eigenaar bestaat niet
    delete:
      summary: Verwijder een auto via het id
      operationId: deleteCar
      tags:
        - Cars
      parameters:
        - name: id
          in: path
          required: true
          description: Het id van de auto
          schema:
            type: integer
            format: int32
          example: 1
      responses:
        "204":
          description: Auto succesvol verwijderd
        "404":
          description: Auto niet gevonden
  /cars/import:
    post:
      summary: Importeer een auto via het kenteken
      operationId: importCar
      tags:
        - Cars
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CarRequest"
      responses:
        "201":
          description: Auto succesvol geïmporteerd
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Car"
        "400":
          description: Ongeldige waarde in de request
        "409":
          description: Kenteken bestaat al of eigenaar bestaat niet
        "422":
          description: Kenteken onbekend bij de RDW, of RDW-gegevens niet te verwerken
        "502":
          description: De RDW API is niet bereikbaar of gaf een ongeldig antwoord
  /cars/{carId}/maps:
    get:
      summary: Open de locatie van een auto in Google Maps
      description: Stuurt door naar Google Maps met de laatst bekende locatie van de auto.
      operationId: getCarLocationInMaps
      tags:
        - Maps
      parameters:
        - name: carId
          in: path
          required: true
          description: Het id van de auto
          schema:
            type: integer
            format: int32
          example: 1
      responses:
        "200":
          description: Doorverwijzing naar de laatst bekende locatie in Google Maps
          headers:
            Location:
              description: URL van de locatie in Google Maps
              schema:
                type: string
                format: uri
        "400":
          description: Ongeldig auto-id
        "404":
          description: Geen locatie bekend voor deze auto

components:
  schemas:
    Car:
      oneOf:
        - $ref: "#/components/schemas/ICECar"
        - $ref: "#/components/schemas/BEVCar"
        - $ref: "#/components/schemas/FCEVCar"
      discriminator:
        propertyName: type
        mapping:
          ICECar: "#/components/schemas/ICECar"
          BEVCar: "#/components/schemas/BEVCar"
          FCEVCar: "#/components/schemas/FCEVCar"

    CarBase:
      type: object
      required:
        - id
        - ownerId
        - licensePlate
        - brand
        - model
        - productionYear
        - color
        - seats
        - vehicleType
        - readyToDriveWeightKg
        - consumptionCombined
        - co2EmissionCombined
      properties:
        id:
          type: integer
        ownerId:
          type: integer
        licensePlate:
          type: string
        brand:
          type: string
        model:
          type: string
        productionYear:
          type: integer
        trim:
          type: string
          nullable: true
        color:
          type: string
        seats:
          type: integer
        doors:
          type: integer
          nullable: true
        vehicleType:
          type: string
          enum:
            - PASSENGER_CAR
            - LIGHT_COMMERCIAL_VEHICLE
        readyToDriveWeightKg:
          type: integer
        consumptionCombined:
          type: number
          format: double
        co2EmissionCombined:
          type: number
          format: double

    ICECar:
      allOf:
        - $ref: "#/components/schemas/CarBase"
        - type: object
          required:
            - type
            - fuelType
            - tankCapacityL
            - automaticTransmission
          properties:
            type:
              type: string
              enum: [ICECar]
            fuelType:
              type: string
              enum: [PETROL, DIESEL, LPG]
            tankCapacityL:
              type: number
              format: double
            automaticTransmission:
              type: boolean

    BEVCar:
      allOf:
        - $ref: "#/components/schemas/CarBase"
        - type: object
          required:
            - type
            - batteryCapacityKWh
          properties:
            type:
              type: string
              enum: [BEVCar]
            batteryCapacityKWh:
              type: number
              format: double

    FCEVCar:
      allOf:
        - $ref: "#/components/schemas/CarBase"
        - type: object
          required:
            - type
            - tankCapacityKgH2
          properties:
            type:
              type: string
              enum: [FCEVCar]
            tankCapacityKgH2:
              type: number
              format: double
    CarRequest:
      type: object
      required:
        - licensePlate
        - ownerId
      properties:
        licensePlate:
          type: string
        ownerId:
          type: integer
          format: int32
        trim:
          type: string
          nullable: true
        tankCapacityL:
          type: number
          format: double
          nullable: true
        automaticTransmission:
          type: boolean
          nullable: true
        batteryCapacityKWh:
          type: number
          format: double
          nullable: true
        tankCapacityKgH2:
          type: number
          format: double
          nullable: true
    CarChangeRequest:
      type: object
      properties:
        licensePlate:
          type: string
          nullable: true
        ownerId:
          type: integer
          format: int32
          nullable: true
        brand:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        productionYear:
          type: integer
          format: int32
          nullable: true
        trim:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
        seats:
          type: integer
          format: int32
          nullable: true
        doors:
          type: integer
          format: int32
          nullable: true
        vehicleType:
          type: string
          enum:
            - PASSENGER_CAR
            - LIGHT_COMMERCIAL_VEHICLE
          nullable: true
        readyToDriveWeightKg:
          type: integer
          format: int32
          nullable: true
        consumptionCombined:
          type: number
          format: double
          nullable: true
        co2EmissionCombined:
          type: number
          format: double
          nullable: true
        fuelType:
          type: string
          enum: [PETROL, DIESEL, LPG]
          nullable: true
        tankCapacityL:
          type: number
          format: double
          nullable: true
        automaticTransmission:
          type: boolean
          nullable: true
        batteryCapacityKWh:
          type: number
          format: double
          nullable: true
        tankCapacityKgH2:
          type: number
          format: double
          nullable: true