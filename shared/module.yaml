product:
  type: kmp/lib
  platforms: [android, iosArm64, iosSimulatorArm64]

dependencies:
  - ../contracts: exported
  - $compose.foundation: exported
  - $compose.material3: exported
  - $compose.components.resources
  - $compose.preview
  - $libs.ktor.client.core
  - $libs.ktor.client.content.negotiation
  - $libs.ktor.serialization.kotlinx.json
  - $libs.androidx.navigation3.ui
  - $libs.androidx.lifecycle.viewmodel.navigation3
  - $libs.kotlinx.serialization.core

dependencies@android:
  - $compose.uiTooling
  - $libs.ktor.client.okhttp
  - $libs.androidx.navigation3.android.runtime
  - $libs.androidx.navigation3.android.ui

dependencies@ios:
  - $libs.ktor.client.darwin

settings:
  kotlin:
    serialization: enabled
  compose:
    enabled: true
    resources:
      packageName: nl.carsharing.app.resources
  android:
    namespace: nl.carsharing.shared
